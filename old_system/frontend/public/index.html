<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>PentaSync</title>
<!-- Favicon rong nhung ton tai: khong khai bao thi trinh duyet tu goi /favicon.ico va nhan 404,
     lam ban log backend lien tuc suot ca ngay tren 5 man kiosk. -->
<link rel="icon" href="data:," />
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: manipulation; /* bo tap-delay/double-tap-zoom tren touchscreen that */
    -webkit-user-select: none;
    user-select: none;
  }
  #psync-root { width: 100vw; height: 100vh; }
  #psync-overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.7);
    z-index: 1000;
  }
  #psync-debug-label {
    position: fixed;
    left: 8px;
    bottom: 8px;
    z-index: 2000;
    font: 12px monospace;
    color: #0f0;
    background: rgba(0, 0, 0, 0.5);
    padding: 2px 8px;
    border-radius: 4px;
    pointer-events: none; /* khong bao gio chan click cua noi dung ben duoi */
  }
</style>
</head>
<body>
  <div id="psync-root"></div>
  <div id="psync-overlay"></div>
  <div id="psync-debug-label">...</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
