<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif; }
    a { color: #1668A8; } a:hover { color: #0F4E7E; }
  </style>
</helmet>

<div style="width: 1920px; height: 1080px; box-sizing: border-box; background: #FFFFFF; color: #101A22; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 40px 72px 32px 72px; border-bottom: 2px solid #E4E9ED;">
    <div style="display: flex; align-items: center; gap: 20px;">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#1668A8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3.5 4 7v6c0 4.6 3.3 7.6 8 8.5 4.7-.9 8-3.9 8-8.5V7l-8-3.5Z"></path>
        <path d="M12 9.2v5.6M9.2 12h5.6"></path>
      </svg>
      <div style="font-size: 30px; font-weight: 600; letter-spacing: 0.06em; color: #5A6B78; text-transform: uppercase;">[TÊN BỆNH VIỆN]</div>
    </div>
    <div style="font-size: 29px; font-weight: 500; color: #7A8894;">Quầy thông tin tự phục vụ</div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 72px;">

    <div style="margin-bottom: 68px;">
      <div style="font-size: 104px; font-weight: 800; line-height: 1.02; letter-spacing: -0.02em;">Xin chào</div>
      <div style="font-size: 46px; font-weight: 400; color: #5A6B78; margin-top: 16px;">Bạn muốn xem gì?</div>
    </div>

    <div style="display: flex; gap: 48px;">

      <div style="flex-grow: 1; flex-basis: 0; background: #FFFFFF; border: 3px solid #C3CDD6; border-radius: 28px; padding: 56px; display: flex; flex-direction: column; gap: 26px; position: relative;">
        <div style="width: 112px; height: 112px; border-radius: 24px; background: #EDF3F8; display: flex; align-items: center; justify-content: center;">
          <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#1668A8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="4" width="19" height="13" rx="2"></rect>
            <path d="M12 17v3M8 20h8"></path>
            <path d="M6.5 12.5 9.5 9l3 3 4.5-5"></path>
          </svg>
        </div>
        <div style="font-size: 58px; font-weight: 700; line-height: 1.15;">Thông tin bệnh viện</div>
        <div style="font-size: 32px; font-weight: 400; color: #5A6B78; line-height: 1.45; text-wrap: pretty;">Giờ khám, nội quy, quy trình khám và sơ đồ khoa phòng — hiện lên các màn hình bên cạnh.</div>
        <div style="position: absolute; right: 48px; bottom: 48px;">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#9AA8B4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6.5 15 12l-5.5 5.5"></path></svg>
        </div>
      </div>

      <div style="flex-grow: 1; flex-basis: 0; background: #FFFFFF; border: 3px solid #C3CDD6; border-radius: 28px; padding: 56px; display: flex; flex-direction: column; gap: 26px; position: relative;">
        <div style="width: 112px; height: 112px; border-radius: 24px; background: #EDF3F8; display: flex; align-items: center; justify-content: center;">
          <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#1668A8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.5 12.5c0 3.9-3.8 7-8.5 7-1 0-2-.15-2.9-.42L4 20.5l1.5-3.6C4.2 15.7 3.5 14.2 3.5 12.5c0-3.9 3.8-7 8.5-7s8.5 3.1 8.5 7Z"></path>
            <path d="M12 9.3v4.4M9.8 11.5h4.4"></path>
          </svg>
        </div>
        <div style="font-size: 58px; font-weight: 700; line-height: 1.15;">Chat với Superdoc</div>
        <div style="font-size: 32px; font-weight: 400; color: #5A6B78; line-height: 1.45; text-wrap: pretty;">Hỏi đáp với trợ lý ảo của bệnh viện về giờ khám, thủ tục, bảo hiểm y tế.</div>
        <div style="position: absolute; right: 48px; bottom: 48px;">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#9AA8B4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6.5 15 12l-5.5 5.5"></path></svg>
        </div>
      </div>

    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 16px; padding-bottom: 54px; color: #7A8894;">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 11V6.2a1.7 1.7 0 0 1 3.4 0V11"></path>
      <path d="M12.4 11V9.2a1.7 1.7 0 0 1 3.4 0V11"></path>
      <path d="M15.8 11.4v-1a1.7 1.7 0 0 1 3.4 0v4.4c0 3.4-2.3 6.2-5.9 6.2-2.6 0-4-1-5.3-2.8l-2.6-4a1.7 1.7 0 0 1 2.7-2l1.5 1.8"></path>
    </svg>
    <div style="font-size: 30px; font-weight: 500;">Chạm vào ô bạn muốn chọn</div>
  </div>

</div>
</x-dc>
</body>
</html>
